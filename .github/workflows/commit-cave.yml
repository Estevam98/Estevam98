name: Commit Cave

on:
  push:
    branches: [main]
    paths:
      - "commit-cave/**"
      - "scripts/commit-cave.js"
      - ".github/workflows/commit-cave.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: commit-cave-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect public commit history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Estevam98
        run: node scripts/commit-cave.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: commit-cave

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4