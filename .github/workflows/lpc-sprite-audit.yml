name: Inspect Universal LPC spritesheet
on:
  push:
    branches:
      - analysis/lpc-sprite-audit
    paths:
      - .github/workflows/lpc-sprite-audit.yml
      - scripts/inspect-lpc-spritesheet.py
      - commit-cave/assets/hero-sheet.png
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Inspect every LPC frame with Pillow
        run: python scripts/inspect-lpc-spritesheet.py
      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: lpc-sprite-audit
          path: |
            lpc-audit.json
            lpc-contact-sheet.png
            lpc-all-frames-rows-0-53.png
          if-no-files-found: error
